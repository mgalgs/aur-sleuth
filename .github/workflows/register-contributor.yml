---
# Merge a registration pull request when every rule passes, close it when one
# does not.
#
# Registering is how someone becomes able to submit an audit report: one pull
# request against `trusted-contributors`, one signed commit, one line added to
# the `trusted-contributors` file. `bench/register-contributor.py` decides;
# this job only fetches what that script reads and acts on its exit code.
# `docs/SUBMITTING-REPORTS.md` is the contributor's side.
#
# `pull_request_target` rather than `pull_request`: merging and commenting
# need a write token, and a `pull_request` job from a fork gets a read-only
# one. That token makes what is checked out matter, so the checkout is pinned
# to `master` and is never the pull request's head. Nothing from the pull
# request is executed: the untrusted values are API responses written to
# files and passed to the script as paths, and the author's login, which is
# passed through the environment rather than interpolated into a command.
#
# Merging with `--merge` is deliberate. A rebase or a squash would rewrite the
# contributor's commit, and the whole point of the commit is its signature.
name: register-contributor

"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [trusted-contributors]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: register-contributor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Collect what the rules read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LOGIN: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          gh api "repos/$GH_REPO/pulls/$PR" > inputs/pr.json
          gh api "repos/$GH_REPO/pulls/$PR/commits" > inputs/commits.json
          gh api "users/$LOGIN" > inputs/user.json
          gh api "users/$LOGIN/ssh_signing_keys" > inputs/keys.json
          gh api "users/$LOGIN/events/public?per_page=100" --jq 'length' \
            > inputs/events.txt

          # The compare endpoint carries both remaining inputs: the per-file
          # add/remove counts, and the patch the one added line is in.
          gh api "repos/$GH_REPO/compare/$BASE_SHA...$HEAD_SHA" \
            > inputs/compare.json
          jq -r '.files[]
                 | [(.additions|tostring), (.deletions|tostring), .filename]
                 | @tsv' inputs/compare.json > inputs/numstat.txt
          jq -r '.files[] | select(.filename == "trusted-contributors")
                 | .patch // ""' inputs/compare.json \
            | grep '^+' | grep -v '^+++' | sed 's/^+//' \
            > inputs/line.txt || true

          # The base file every rule is judged against. Its absence and its
          # failure to arrive look identical in a shell, and they are opposite
          # things: an empty base is correct before the first contributor
          # lands, but an empty base on a transient API failure silently
          # disables rule 7 -- register-contributor.py's duplicate loop reads
          # this file, and over an empty one it finds no duplicates, so a
          # second registration of an email or key already on the branch
          # merges. That is the copy-paste artifact the added-line comment in
          # register-contributor.py warns about, arriving by a different door:
          # the branch then fails its own format check for every registration
          # afterwards. A `gh` failure that writes its JSON error body here is
          # as bad the other way -- every registration is refused as "the
          # trusted-contributors file on the branch is itself malformed",
          # which is a lie about the submitter's work.
          #
          # So only a 404 -- the file or the branch does not exist yet -- may
          # become an empty base. Every other outcome fails the job.
          if gh api "repos/$GH_REPO/contents/trusted-contributors?ref=trusted-contributors" \
               -H "Accept: application/vnd.github.raw" \
               > inputs/base.raw 2> inputs/base.err; then
            mv inputs/base.raw inputs/base
          elif grep -q 'HTTP 404' inputs/base.err; then
            : > inputs/base
          else
            echo "could not read the trusted-contributors file:" >&2
            cat inputs/base.err >&2
            exit 1
          fi

          # And the same file as the HEAD COMMIT has it, which is what a merge
          # actually puts on the branch. The rules otherwise judge a
          # reconstruction of those bytes -- a pair of counts, and a string
          # this job builds by appending the added line -- and a
          # reconstruction always ends in a newline whether the head does or
          # not. register-contributor.py compares the two.
          #
          # No 404 case here. An absent base is correct before the first
          # contributor lands, but the head of a registration always has the
          # file: rule 2's numstat says a line was added to it. So anything
          # other than success is an infrastructure failure, and the job stops
          # rather than judging bytes it does not have.
          head_url="repos/$GH_REPO/contents/trusted-contributors?ref=$HEAD_SHA"
          if gh api "$head_url" \
               -H "Accept: application/vnd.github.raw" \
               > inputs/head.raw 2> inputs/head.err; then
            mv inputs/head.raw inputs/head
          else
            echo "could not read trusted-contributors at the head commit:" >&2
            cat inputs/head.err >&2
            exit 1
          fi

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          rc=0
          python3 bench/register-contributor.py \
            --pr inputs/pr.json \
            --commits inputs/commits.json \
            --user inputs/user.json \
            --signing-keys inputs/keys.json \
            --diff inputs/numstat.txt \
            --added-line inputs/line.txt \
            --base-file inputs/base \
            --head-file inputs/head \
            --public-events "$(cat inputs/events.txt)" \
            > inputs/reasons.txt 2>&1 || rc=$?
          cat inputs/reasons.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Merge and say the invitation is coming
        if: steps.decide.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --match-head-commit, because the rules were checked against
          # HEAD_SHA and a push can land between that check and this merge.
          # Without it a contributor could pass the checks and then merge
          # something else into the file that decides who may submit.
          gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
          doc="https://github.com/$GH_REPO/blob/master/docs/SUBMITTING-REPORTS.md"
          gh pr comment "$PR" --body "Every check passed and this is merged.

          An invitation to the network reports are submitted over will be
          emailed to the address on the line you added. Joining is a client
          install and following the link in that email.

          When you are on, submit with \`aur-sleuth-submit <report> <package>\`.
          See [docs/SUBMITTING-REPORTS.md]($doc)."

      - name: Say why, and close
        if: steps.decide.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          doc="https://github.com/$GH_REPO/blob/master/docs/SUBMITTING-REPORTS.md"
          {
            echo "This registration was not merged:"
            echo
            echo '```'
            cat inputs/reasons.txt
            echo '```'
            echo
            echo "Fix what is listed and reopen this pull request; the checks"
            echo "run again on reopen. The rules are in"
            echo "[docs/SUBMITTING-REPORTS.md]($doc)."
          } > inputs/comment.md
          gh pr comment "$PR" --body-file inputs/comment.md
          gh pr close "$PR"
